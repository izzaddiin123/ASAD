---
- name: Ensure ASAD tools directory exists on DC
  win_file:
    path: C:\ASAD-Tools
    state: directory

- name: Copy Purple Logging script to DC
  win_copy:
    src: "{{ playbook_dir }}/../Enable-PurpleLogging.ps1"
    dest: "C:\\ASAD-Tools\\Enable-PurpleLogging.ps1"

- name: Copy Background Traffic script to DC
  win_copy:
    src: "{{ playbook_dir }}/../Invoke-BackgroundTraffic.ps1"
    dest: "C:\\ASAD-Tools\\Invoke-BackgroundTraffic.ps1"

- name: Execute Purple Team Logging configuration
  win_shell: powershell.exe -ExecutionPolicy Bypass -File "C:\\ASAD-Tools\\Enable-PurpleLogging.ps1"

- name: Register Background Traffic Generator as a persistent startup task
  win_scheduled_task:
    name: "ASAD_BackgroundTraffic"
    description: "Generates background AD authentication and LDAP traffic for ASAD lab."
    executable: "powershell.exe"
    arguments: "-NoProfile -ExecutionPolicy Bypass -File C:\\ASAD-Tools\\Invoke-BackgroundTraffic.ps1"
    trigger:
      - type: boot
    username: "SYSTEM"
    run_level: highest
    state: present
    enabled: yes
